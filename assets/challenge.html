<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Check</title>
    <style>
        :root {
            --body-bg: #f0f0f0;
            --card-bg: #fff;
            --title-color: #4e4848;
            --text-color: #686868;
            --icon-color: #d9dbdd;
            --spinner-color: var(--title-color);
            --spinner-bg: rgba(0, 0, 0, 0.1);
            --noscript-bg: rgba(216, 0, 12, .06);
            --noscript-color: #d8000c;
            --error-color: #d8000c;
            --success-color: #28a745;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --body-bg: #141517;
                --card-bg: #202124;
                --title-color: #f8faff;
                --text-color: #b0b2ba;
                --icon-color: #757580;
                --spinner-color: var(--title-color);
                --spinner-bg: rgba(255, 255, 255, 0.1);
                --noscript-color: #ff7076;
                --error-color: #ff7076;
                --success-color: #5cb85c;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--body-bg);
            margin: 0;
            color: var(--title-color);
            hanging-punctuation: none;
            text-wrap: pretty;
        }

        #security {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: .125rem;
            box-shadow: 0 1rem 1.5rem -.5rem rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 60ch;
            width: 90%;
        }

        h1 {
            color: var(--title-color);
            margin-bottom: 1rem;
            font-size: 1.8em;
        }

        p {
            color: var(--text-color);
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        #bot-check-widget {
            min-height: 3rem;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            border: 4px solid var(--spinner-bg);
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            border-left-color: var(--spinner-color);
            animation: spin 1s ease infinite;
            margin: 1rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .noscript-warning {
            color: var(--noscript-color);
            background: var(--noscript-bg);
            border: 2px solid var(--noscript-color);
            padding: 1rem;
            margin-top: 1rem;
            border-radius: .25rem;
            text-align: left;
        }

        .noscript-warning > * {
            display: block;
            margin-bottom: 5px;
        }

        .status-icon {
            width: 6rem;
            height: 6rem;
            color: var(--icon-color);
        }

        .icon-wrapper {
            display: none;
        }

        .status-message {
            font-size: 1.2em;
            color: var(--text-color);
            margin-top: 1rem;
        }

        .status-fail h1,
        .status-fail .status-message {
            color: var(--error-color);
        }

        .status-success h1,
        .status-success .status-message {
            color: var(--success-color);
        }

        .verify-button {
            background-color: var(--title-color);
            color: var(--card-bg);
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1em;
            border-radius: .25rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .verify-button:hover,
        .verify-button:focus-visible {
            opacity: .85;
        }

    </style>
</head>

    window.trans = {};

    function setLanguage() {
        const userLang = navigator.language || navigator.userLanguage;
        const detectedLang = userLang.split('-')[0].toLowerCase();
        const primaryLang = { nb: 'no', nn: 'no' }[detectedLang] || detectedLang;
        const langCode = i18n[primaryLang] ? primaryLang : 'en';
        window.trans = i18n[langCode]; // Store translations globally

        // Set the HTML lang attribute
        document.documentElement.lang = langCode;

        // Update page content initially
        document.title = trans.pageTitle;
        document.getElementById('main-heading').textContent = trans.mainHeading;
        document.getElementById('info-paragraph').textContent = trans.infoParagraph;
        document.getElementById('footer-note').textContent = trans.footerNote;

        // Hide non-relevant language warnings in noscript
        document.querySelectorAll('.noscript-warning [class^="lang-"]').forEach(el => el.style.display = 'none');
        document.querySelectorAll(`.noscript-warning .lang-${langCode}`).forEach(el => el.style.display = 'block');
    }

    document.addEventListener('DOMContentLoaded', setLanguage);
</script>

<script>
    const security = document.getElementById('security');
    const headingElement = document.getElementById('main-heading');
    const infoElement = document.getElementById('info-paragraph');
    const widgetElement = document.getElementById('bot-check-widget');
    const footerElement = document.getElementById('footer-note');

    const nonce = crypto?.randomUUID();

    async function sha(text, algo = 'SHA-256') {
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await crypto.subtle.digest(algo, data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function showError() {
        security.classList.add('status-fail');
        headingElement.textContent = trans.errorHeading;
        infoElement.textContent = trans.errorMessage;
        widgetElement.innerHTML = `
            <svg class="status-icon" aria-hidden="true" focusable="false" data-prefix="fas" role="img" xmlns="http://www.w3.org/2000/svg">
                <use xlink:href="#icon-bot"></use>
            </svg>
        `;  // <span class="status-message">${currentTranslations.errorWidget}</span>
        footerElement.textContent = trans.errorFooter;
    }

    function showSuccess() {
        security.classList.add('status-success');
        headingElement.textContent = trans.successHeading;
        infoElement.textContent = trans.successMessage;
        widgetElement.innerHTML = `
            <svg class="status-icon" aria-hidden="true" focusable="false" data-prefix="fas" role="img" xmlns="http://www.w3.org/2000/svg">
                <use xlink:href="#icon-shield"></use>
            </svg>
        `;  // <span claavss="status-message">${currentTranslations.successWidget}</span>
        footerElement.textContent = trans.successFooter;
    }

    async function getChallenge() {
        try {
            if (!nonce || nonce.length < 16) {
                console.error("Failed to generate nonce.");
                return null;
            }

            const response = await fetch('?_botlock=challenge', {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                    "Botlock-Nonce": nonce,
                }
            });
            if (!response.ok) {
                return null;
            }
            return await response.json()
        } catch (error) {
            console.error(error.message);
            return null;
        }
    }

    async function solveChallenge({
        'alg': algorithm,
        'exp': expire,
        'max': max = 0,
        'slt': salt,
        'tgt': target,
        'sig': signature,
    }) {
        const hashAlgo = {
            'sha256': 'SHA-256',
            'sha384': 'SHA-384',
            'sha512': 'SHA-512',
        }[algorithm] || null;

        if (!hashAlgo) {
            return null;
        }

        let num = null;

        for (let i = 1; i <= max; i++)
        {
            const hash = await sha(`${i}:${salt}:${expire}`, hashAlgo);

            if (hash === target) {
                num = i;
                break;
            }
        }

        if (num === null) {
            console.error("No match found.");
            return null;
        }

        return { num, sig: signature, slt: salt, exp: expire, alg: algorithm };
    }

    async function sendResult(result) {
        const response = await fetch("?_botlock=verify", {
            method: "POST",
            body: JSON.stringify(result),
            headers: {
                "Content-Type": "application/json",
                "Botlock-Nonce": nonce,
            }
        })

        return response.ok;
    }

    async function loadI18n() {
        if (Object.keys(trans).length > 0) {
            return true;
        }
        console.error("Translations not loaded yet. Waiting briefly.");
        await new Promise(resolve => setTimeout(resolve, 100));
        if (Object.keys(trans).length === 0) {
            alert("Error loading page language configuration.");
            return false;
        }
        return true;
    }

    async function botlock() {
        if (!window.crypto || !window.crypto.subtle) {
            showError();
            return;
        }

        if (!await loadI18n()) {
            showError();
            return;
        }

        const challenge = await getChallenge();
        if (!challenge) {
            showError();
            return;
        }

        const { auto_start: autoStart = false } = challenge;
        if (!autoStart) {
            showConfirm(challenge);
            return;
        }

        await runChallenge(challenge);
    }

    function showConfirm(challenge) {
        headingElement.textContent = trans.confirmHeading;
        infoElement.textContent = trans.confirmParagraph;

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'verify-button';
        button.textContent = trans.verifyButton;
        button.addEventListener('click', () => {
            widgetElement.innerHTML = '<div class="spinner"></div>';
            headingElement.textContent = trans.mainHeading;
            infoElement.textContent = trans.infoParagraph;
            runChallenge(challenge);
        }, { once: true });

        widgetElement.replaceChildren(button);
        button.focus();
    }

    async function runChallenge(challenge) {
        const res = await solveChallenge(challenge);
        if (res === null) {
            showError();
            return;
        }

        const success = await sendResult(res);
        if (!success) {
            showError();
            return;
        }

        showSuccess();

        setTimeout(() => {
            window.location.reload();
        }, 600);
    }

    document.addEventListener('DOMContentLoaded', botlock);
</script>
