name: Build and Release PHAR

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_NAME: botlock
  PHAR_FILENAME: botlock.phar
  PHP_VERSION: '8.2'

jobs:
  build-phar:
    name: Test, build and publish PHAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, zip, phar
          tools: composer
          coverage: none
          ini-values: phar.readonly=0

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ env.PHP_VERSION }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ env.PHP_VERSION }}-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: Install dependencies (with dev)
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Run tests
        run: composer test

      - name: Install dependencies (production only)
        run: composer install --no-progress --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Build the PHAR archive
        run: php build-phar.php

      - name: Verify PHAR file exists
        run: |
          if [ ! -f "$PHAR_FILENAME" ]; then
            echo "::error::PHAR file '$PHAR_FILENAME' not found after build!"
            exit 1
          fi
          ls -l "$PHAR_FILENAME"

      - name: Smoke test the PHAR
        env:
          BOTLOCK_ENABLED: 'yes'
          BOTLOCK_THREAT_LEVEL_OVERRIDE: '2'
          BOTLOCK_STATE_DIR: ${{ runner.temp }}/botlock-state
        run: |
          # Serve a stub page with the freshly built PHAR prepended and expect the
          # challenge page (401 + session cookie) from a bare request. The stub
          # lives outside the repo because the built-in server answers 404 for a
          # missing index.php before the prepend runs.
          DOCROOT="$RUNNER_TEMP/smoke-docroot"
          mkdir -p "$DOCROOT"
          echo '<?php echo "Passed BOTLOCK";' > "$DOCROOT/index.php"
          php -S 127.0.0.1:8099 -t "$DOCROOT" -d "auto_prepend_file=phar://$PWD/$PHAR_FILENAME" > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2

          STATUS=$(curl -s -o body.html -D headers.txt -w '%{http_code}' http://127.0.0.1:8099/)
          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "401" ]; then
            echo "::error::Expected 401 challenge from the PHAR, got $STATUS"
            cat headers.txt body.html server.log
            exit 1
          fi

          if ! grep -qi '^set-cookie: BOTLOCKSESS=' headers.txt; then
            echo "::error::No BOTLOCKSESS cookie in the challenge response"
            cat headers.txt server.log
            exit 1
          fi

          if grep -qiE 'php (fatal|warning|parse)' server.log; then
            echo "::error::PHP errors while serving from the PHAR"
            cat server.log
            exit 1
          fi

          echo "PHAR boots and issues a challenge."

      - name: Upload PHAR to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ASSET="$PROJECT_NAME-$TAG.phar"
          cp "$PHAR_FILENAME" "$ASSET"
          gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Uploaded $ASSET to release $TAG"

      - name: Upload PHAR as workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the single file as-is, so the download is
          # botlock.phar itself rather than a zip (the artifact takes the file's name)
          path: ${{ env.PHAR_FILENAME }}
          archive: false
          if-no-files-found: error
          retention-days: 14
